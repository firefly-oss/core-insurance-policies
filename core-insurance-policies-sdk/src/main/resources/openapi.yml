components:
  schemas:
    PolicyDTO:
      required:
      - contractId
      - inceptionDate
      - lineOfBusiness
      - policyNumber
      - policyStatus
      - productId
      - tenantId
      type: object
      properties:
        policyId:
          type: string
          format: uuid
          readOnly: true
        tenantId:
          type: string
          format: uuid
        contractId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        policyNumber:
          maxLength: 64
          minLength: 0
          type: string
        lineOfBusiness:
          type: string
          enum:
          - MOTOR
          - PROPERTY
          - LIABILITY
          - LIFE
          - HEALTH
          - MARINE
          - AVIATION
          - ACCIDENT
          - OTHER
        policyStatus:
          type: string
          enum:
          - QUOTE
          - BOUND
          - IN_FORCE
          - LAPSED
          - CANCELLED
          - EXPIRED
        currency:
          pattern: "[A-Z]{3}"
          type: string
        inceptionDate:
          type: string
          format: date
        expiryDate:
          type: string
          format: date
        renewalDate:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PolicyTransactionDTO:
      required:
      - effectiveDate
      - policyId
      - sequenceNumber
      - transactionNumber
      - transactionStatus
      - transactionType
      type: object
      properties:
        policyTransactionId:
          type: string
          format: uuid
          readOnly: true
        policyId:
          type: string
          format: uuid
        transactionNumber:
          maxLength: 64
          minLength: 0
          type: string
        transactionType:
          type: string
          enum:
          - NEW_BUSINESS
          - ENDORSEMENT
          - RENEWAL
          - CANCELLATION
          - REINSTATEMENT
        transactionStatus:
          type: string
          enum:
          - DRAFT
          - QUOTED
          - BOUND
          - ISSUED
          - REVERSED
        effectiveDate:
          type: string
          format: date
        expiryDate:
          type: string
          format: date
        sequenceNumber:
          type: integer
          format: int32
        outOfSequence:
          type: boolean
        noticeDays:
          type: integer
          format: int32
        reason:
          maxLength: 4000
          minLength: 0
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PolicyStatusHistoryDTO:
      required:
      - changedAt
      - policyId
      - policyStatus
      type: object
      properties:
        policyStatusHistoryId:
          type: string
          format: uuid
          readOnly: true
        policyId:
          type: string
          format: uuid
        policyStatus:
          type: string
          enum:
          - QUOTE
          - BOUND
          - IN_FORCE
          - LAPSED
          - CANCELLED
          - EXPIRED
        statusReason:
          maxLength: 500
          minLength: 0
          type: string
        changedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PropertyDetailDTO:
      required:
      - insuredObjectId
      - policyId
      type: object
      properties:
        propertyDetailId:
          type: string
          format: uuid
          readOnly: true
        policyId:
          type: string
          format: uuid
        insuredObjectId:
          type: string
          format: uuid
        occupancy:
          maxLength: 128
          minLength: 0
          type: string
        construction:
          maxLength: 128
          minLength: 0
          type: string
        yearBuilt:
          type: integer
          format: int32
        addressLine:
          maxLength: 255
          minLength: 0
          type: string
        city:
          maxLength: 100
          minLength: 0
          type: string
        postalCode:
          maxLength: 20
          minLength: 0
          type: string
        countryCode:
          maxLength: 2
          minLength: 0
          type: string
        buildingsSum:
          type: number
        contentsSum:
          type: number
        currency:
          pattern: "[A-Z]{3}"
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PolicyPartyDTO:
      required:
