openapi: 3.0.1
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:18080
  description: Generated server url
tags:
- name: Liability Details
  description: Exposure for a liability policy
- name: Certificates of Insurance
  description: "Certificate issued from a policy transaction, reissued when the cover\
    \ changes"
- name: Property Details
  description: "Location and sums for a property policy, including home and commercial\
    \ premises"
- name: Health Details
  description: Member cover on a health policy
- name: Policy Status History
  description: Status change recorded against a policy
- name: Policies
  description: Insurance policy master record
- name: Motor Details
  description: Vehicle and principal driver for a motor policy
- name: Coverages
  description: Coverage terms recorded against a policy transaction
- name: Insured Objects
  description: Risk object attached to a policy transaction
- name: Policy Parties
  description: Party role on a policy. The party itself is owned by customer management.
- name: Life Details
  description: Life assured and sum assured on a life policy
- name: Policy Transactions
  description: "New business, endorsement, renewal, cancellation, or reinstatement\
    \ on a policy"
paths:
  /api/v1/policies/{policyId}:
    get:
      tags:
      - Policies
      summary: Get Policy by id
      description: Retrieve one Policy
      operationId: getPolicyById
      parameters:
      - name: policyId
        in: path
        description: Unique identifier of the Policy
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Idempotency-Key
        in: header
        description: "Unique key for idempotent requests. If provided, ensures that\
          \ identical requests with the same key will only be processed once."
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Policy found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PolicyDTO"
        "404":
          description: Policy not found
    put:
